:root{
  --bg:#FFFFFF;--surface:#F1F4F9;--surface-2:#E3E9F2;--text:#0E213F;--muted:#4A5A72;--line:#D3DBE7;
  --accent:#1E5EA6;--accent-text:#1E5EA6;--sky:#498ED9;--amber:#F1A416;--wood:#E6C9A2;--wood-line:#A97A46;
  --deep:#0E213F;--on-deep:#F2F5FA;--on-deep-muted:#A8B7CE;--good:#1D7A4E;--bad:#B0392B;--amber-text:#8F5D00;--warn:#8F5D00;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1426;--surface:#101D35;--surface-2:#172745;--text:#E6ECF5;--muted:#9DABC2;--line:#24365A;
  --accent:#498ED9;--accent-text:#7FB2EC;--deep:#071021;--good:#5CC793;--bad:#F08C7A;--amber-text:#F3B53A;--warn:#F3B53A;--wood:#6B5136;--wood-line:#C99A62;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0A1426;--surface:#101D35;--surface-2:#172745;--text:#E6ECF5;--muted:#9DABC2;--line:#24365A;
  --accent:#498ED9;--accent-text:#7FB2EC;--deep:#071021;--good:#5CC793;--bad:#F08C7A;--amber-text:#F3B53A;--warn:#F3B53A;--wood:#6B5136;--wood-line:#C99A62;color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Archivo","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:17px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
img,svg{max-width:100%}
h1,h2,h3{font-stretch:112%;line-height:1.08;letter-spacing:-.015em;margin:0}
h2{font-size:clamp(1.75rem,3.2vw,2.6rem);font-weight:780}
h3{font-size:1.2rem;font-weight:700;letter-spacing:0}
p{margin:0}
a{color:var(--accent-text)}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.lead{font-size:1.15rem;color:var(--muted);max-width:60ch}
.ill{color:var(--text)}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr{display:flex;align-items:center;gap:14px;height:72px;max-width:1360px}
@media (max-width:440px){.hdr .brand .wm{display:none}.hdr{gap:10px}}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text);flex:none}
.mark{width:40px;height:40px;flex:none}
.mark .gap{stroke:var(--bg)}
.wm{display:flex;flex-direction:column;line-height:1}
.wm b{font-weight:850;font-stretch:108%;font-size:1.35rem;letter-spacing:.01em}
.wm small{font-size:.6rem;letter-spacing:.4em;color:var(--accent-text);margin-top:4px;font-weight:500}
.wm.zh b{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;font-size:1.45rem;letter-spacing:.05em}
.wm.zh small{letter-spacing:.12em;color:var(--text);font-weight:700}
.wm.zh small span{color:var(--accent-text);font-weight:500}
nav.main{display:flex;gap:4px;margin-left:auto;align-items:center}
nav.main a,.dd-btn,.pill-group button{white-space:nowrap}

.pill-group{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px}

}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55em;padding:.85em 1.35em;border-radius:999px;font:inherit;font-weight:650;text-decoration:none;cursor:pointer;border:1.5px solid transparent;font-size:1rem}

.btn-line{border-color:currentColor;color:inherit;background:none}

.btns{display:flex;flex-wrap:wrap;gap:12px}

/* hero */
.hero{background:var(--deep);color:var(--on-deep);padding:64px 0 0;overflow:hidden}
.hero .mark .gap{stroke:var(--deep)}
.hero-grid{display:grid;grid-template-columns:1fr 1.05fr;gap:40px;align-items:end}
.hero-text{padding-bottom:64px}
.hero h1{font-size:clamp(2.3rem,4.8vw,4rem);font-weight:820;max-width:14ch}
.hero p.sub{margin:24px 0 32px;font-size:1.15rem;color:var(--on-deep-muted);max-width:50ch}
.hero-ill svg{display:block;width:100%;height:auto}
.glow{animation:glow 1.2s .2s ease-out both}
@keyframes glow{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.glow{animation:none}}

section.block{padding:88px 0}
section.alt{background:var(--surface)}
.head{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:end;margin-bottom:40px}

/* categories */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.cat{display:grid;grid-template-rows:auto 1fr;border:1px solid var(--line);border-radius:28px;overflow:hidden;text-decoration:none;color:var(--text);background:var(--bg)}

/* included */

/* route */

ol.lsteps{list-style:none;margin:28px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:24px;counter-reset:s}

.b2b-band{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center;background:var(--surface);border-radius:28px;padding:44px}

.cta{background:var(--deep);color:var(--on-deep);padding:72px 0}

.energy .metrics strong{font-size:1.55rem;font-weight:800;font-stretch:108%;font-variant-numeric:tabular-nums}
.energy .details{margin:20px 0;display:grid;gap:8px;font-size:.95rem}
.energy .details div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dotted var(--line);padding-bottom:6px}
.energy .details div span:last-child{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.energy .cf svg{display:block;width:100%;height:auto}
.energy .cf h3{font-size:1rem;margin:4px 0 8px}
.energy .leadbox{margin-top:24px;padding-top:22px;border-top:1px solid var(--line)}
.energy .leadbox h3{margin-bottom:6px}
.energy .leadbox .row2{margin-top:14px}
.energy .leadbox .check{margin-top:10px;font-size:.88rem;color:var(--muted)}
.energy .leadbox .btns{margin-top:18px}
.energy .msg{margin-top:12px;font-size:.92rem;font-weight:600}
.energy .msg.err{color:var(--bad)}
.energy .msg.ok{color:var(--good)}
.energy .models{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.energy .model{border:1px solid var(--line);border-radius:20px;padding:26px;background:var(--bg)}
.energy .model .scale{display:inline-block;font-size:.82rem;color:var(--muted);margin-bottom:12px}
.energy .model p{color:var(--muted);margin-top:10px}
@media (max-width:860px){.energy .models{grid-template-columns:1fr}}
.energy ul.checks{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:14px 32px}
.energy ul.checks li{display:flex;gap:12px}
.energy ul.checks svg{flex:none;width:22px;height:22px;color:var(--accent-text);margin-top:2px}
@media (max-width:700px){.energy ul.checks{grid-template-columns:1fr}}
.energy .two{display:grid;grid-template-columns:1fr 1fr;gap:48px}
.energy .two p{color:var(--muted);margin-top:14px}
@media (max-width:760px){.energy .two{grid-template-columns:1fr}}
.energy .channels{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;padding-bottom:88px}
.energy .channel{display:block;border:1px solid var(--line);border-radius:20px;padding:24px;text-decoration:none;color:var(--text);background:var(--bg)}
.energy a.channel:hover{border-color:var(--accent)}
.energy .channel h3{margin:14px 0 6px}
.energy .channel p{color:var(--muted);font-size:.95rem}
.energy .channel .val{display:block;margin-top:12px;font-weight:650;color:var(--accent-text)}
.energy .channel svg{width:30px;height:30px;color:var(--accent-text)}
.energy .result{top:calc(env(safe-area-inset-top,0px) + 92px)}

/* Bruna Energy division colours */
:root[data-brand="energy"]{--bg:#FFFFFF;--surface:#F2F6F3;--surface-2:#E4ECE6;--text:#10291F;--muted:#4C6157;--line:#D2DCD5;--accent:#0F7259;--accent-text:#0F7259;--amber:#F0A515;--amber-text:#8F5D00;--deep:#10291F;--on-deep:#F3F7F4;--on-deep-muted:#A6BFB3;--good:#0F7259;--warn:#8F5D00;--bad:#A33A2B;}
@media (prefers-color-scheme:dark){:root[data-brand="energy"]:not([data-theme="light"]){--bg:#0B1913;--surface:#11241B;--surface-2:#173025;--text:#E5EEE8;--muted:#9AB2A6;--line:#24402F;--accent:#2AA47E;--accent-text:#52C79F;--amber-text:#F3B53A;--deep:#07130E;--good:#52C79F;--warn:#F3B53A;--bad:#F08C7A;}}
:root[data-brand="energy"][data-theme="dark"]{--bg:#0B1913;--surface:#11241B;--surface-2:#173025;--text:#E5EEE8;--muted:#9AB2A6;--line:#24402F;--accent:#2AA47E;--accent-text:#52C79F;--amber-text:#F3B53A;--deep:#07130E;--good:#52C79F;--warn:#F3B53A;--bad:#F08C7A;}

/* energy dropdown + sub-nav */
.dd{position:relative}
.dd-btn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--text);font:inherit;font-weight:500;font-size:.96rem;padding:8px 12px;border-radius:999px;cursor:pointer}
.dd-btn:hover{background:var(--surface)}
.dd-btn.on{background:var(--surface-2)}
.dd-btn svg{transition:transform .15s;flex:none;width:12px;height:12px;max-width:none}
.dd-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.dd-panel{position:absolute;top:calc(100% + 8px);left:0;min-width:230px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:2px;box-shadow:0 12px 32px rgba(14,33,63,.14);z-index:40}
.dd-panel a{display:flex;align-items:center;gap:10px}
.dd-panel .dot{width:10px;height:10px;border-radius:50%;background:#0F7259;flex:none}
@media (max-width:1279px){.dd-panel{position:static;box-shadow:none;border:0;padding:0 0 0 16px}}
.navset{display:flex;gap:4px;align-items:center}
@media (max-width:1279px){.navset{flex-direction:column;align-items:stretch}}
.brand-switch{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;text-decoration:none;font-weight:650;font-size:.92rem;white-space:nowrap;flex:none;color:#fff;background:#10291F}
.brand-switch .mk{width:26px;height:26px;flex:none}
.brand-switch .mk .gap{stroke:#10291F}
:root[data-brand="energy"] .brand-switch{background:#0E213F}
:root[data-brand="energy"] .brand-switch .mk .gap{stroke:#0E213F}
.brand-switch:hover{filter:brightness(1.15)}
@media (max-width:1279px){.brand-switch{margin-left:auto}.menu-btn{margin-left:0}}
@media (max-width:480px){.brand-switch{padding:8px 12px;font-size:.85rem}}
.subnav{border-top:1px solid var(--line);background:var(--surface)}
.subnav .wrap{display:flex;gap:4px;align-items:center;overflow-x:auto;padding-top:8px;padding-bottom:8px;white-space:nowrap}
.subnav a{padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--text);font-size:.92rem;font-weight:500}
.subnav a:hover{background:var(--surface-2)}
.subnav a[aria-current="page"]{background:var(--accent);color:#fff}
.subnav a.back{color:var(--muted)}
.subnav .sep{width:1px;height:20px;background:var(--line);margin:0 8px;flex:none}

/* division band on logistics home */
.div-band{display:grid;grid-template-columns:auto 1fr;gap:48px;align-items:center;background:#10291F;color:#F3F7F4;border-radius:28px;padding:48px}
.div-band h2{color:#fff}
.div-band p{color:#A6BFB3;margin:14px 0 24px;max-width:56ch}
.div-band .brand{color:#fff}
.div-band .mark{width:84px;height:84px}
.div-band .mark .gap{stroke:#10291F}
.div-band .wm b{font-size:2.1rem;color:#fff}
.div-band .wm small{color:#F0A515;font-size:.8rem}
.div-band .wm.zh small{color:#fff}
.div-band .wm.zh small span{color:#F0A515}
.div-band .btn{background:#F0A515;color:#10291F}
@media (max-width:760px){.div-band{grid-template-columns:1fr;padding:28px;gap:24px}}

/* founders */
.team-block{padding-bottom:88px}
.team-block .lead{margin:12px 0 32px}
.founders{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.founder{border:1px solid var(--line);border-radius:24px;padding:28px;background:var(--bg)}
.founder .ph{width:96px;height:96px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);margin-bottom:18px;border:2px dashed var(--line)}
.founder .role{color:var(--accent-text);font-weight:600;margin:6px 0 10px;font-size:.95rem}
.founder p.bio{color:var(--muted);font-size:.95rem}
.founder .links{display:flex;gap:16px;margin-top:16px;font-size:.92rem}
@media (max-width:860px){.founders{grid-template-columns:1fr}}

.uc{background:#F1A416;color:#0E213F;font-weight:600;font-size:.9rem;position:relative;z-index:25}
.uc .wrap{display:flex;gap:12px;align-items:center;padding-top:9px;padding-bottom:9px;max-width:1360px}

.energy .leadbox{display:none}
[hidden]{display:none !important}
</style>

/* ===== Hero day chart ===== */
function buildDayChart(){
  const W=560,H=300,px=36,top=16,bot=34;
  const x = t => px + t/24*(W-px-10);
  const y = v => H-bot - v/110*(H-bot-top);
  const L = t => 18 + 58/(1+Math.exp(-(t-7)*2.5)) * 1/(1+Math.exp((t-20.3)*2.2)) + 30*Math.exp(-(((t-18.6)/1.25)**2));
  const S = t => (t<6.6||t>20.4) ? 0 : 100*Math.pow(Math.sin(Math.PI*(t-6.6)/13.8),1.6);
  const pts=[]; for(let t=0;t<=24.001;t+=0.25) pts.push(t);
  const sol = "M"+x(6.6)+","+y(0)+" "+pts.filter(t=>t>=6.6&&t<=20.4).map(t=>"L"+x(t).toFixed(1)+","+y(S(t)).toFixed(1)).join(" ")+" L"+x(20.4)+","+y(0)+"Z";
  const bt = pts.filter(t=>t>=16 && t<=21.5 && L(t)>S(t));
  const bat = "M"+bt.map(t=>x(t).toFixed(1)+","+y(Math.min(L(t), S(t)+ (L(t)-S(t)))).toFixed(1)).join(" L")+" L"+bt.slice().reverse().map(t=>x(t).toFixed(1)+","+y(S(t)).toFixed(1)).join(" L")+"Z";
  const load = "M"+pts.map(t=>x(t).toFixed(1)+","+y(L(t)).toFixed(1)).join(" L");
  let grid="";
  [0,6,12,18,24].forEach(h=>{grid+=`<line x1="${x(h)}" x2="${x(h)}" y1="${top}" y2="${H-bot}" stroke="rgba(255,255,255,.08)"/><text x="${x(h)}" y="${H-12}" fill="#A6BFB3" font-size="12" text-anchor="middle">${String(h).padStart(2,"0")}:00</text>`});
  $("#dayChart").innerHTML = `${grid}<line x1="${px}" x2="${W-10}" y1="${y(0)}" y2="${y(0)}" stroke="rgba(255,255,255,.25)"/>
    <path d="${sol}" fill="#2AA47E" opacity=".6"/>
    <path d="${bat}" fill="#F0A515" opacity=".9"/>
    <path class="loadline" d="${load}" fill="none" stroke="#F3F7F4" stroke-width="2.5" stroke-linejoin="round"/>`;
}

/* ===== Calculator ===== */
function readInputs(){
  const r = REGIONS[+$("#region").value];
  return {
    region:r, mode:document.querySelector('input[name=cmode]:checked').value,
    bill:+$("#bill").value||0, kwh:+$("#kwh").value||0,
    day:+document.querySelector('input[name=day]:checked').value,
    price:+$("#price").value||0.18, comp:+$("#comp").value||0,
    roof:+$("#roof").value||0, orient:+document.querySelector('input[name=orient]:checked').value,
    batt:$("#batt").checked, hp:$("#hp").checked, fuel:$("#fuel").value,
    area:+$("#area").value||0, ins:+document.querySelector('input[name=ins]:checked').value, dhw:$("#dhw").checked
  };
}
function compute(i){
  const [rname,yld,heat,wm2] = i.region;
  const annual = i.mode==="bill" ? i.bill*12*(1-A.fixedShare)/i.price : i.kwh;
  let other = annual, fuelCost=0, hpElec=0, fuelCO2=0, hpKw=0, hpCost=0, demand=0;
  if(i.hp){
    demand = i.area*heat*i.ins + (i.dhw?1800:0);
    const scop = heat<60 ? 3.4 : 3.0;
    hpElec = demand/scop;
    const f = FUELS[i.fuel];
    if(i.fuel==="electric"){ const heatE=Math.min(demand, annual*0.7); other=annual-heatE; fuelCost=heatE*i.price; fuelCO2=heatE*A.gridCO2; hpElec=heatE/scop; }
    else { fuelCost = demand/f.eff*f.p; fuelCO2 = demand/f.eff*f.co2; }
    const need = i.area*wm2*i.ins/1000 + (i.dhw?1:0);
    hpKw = [6,9,12,16].find(k=>k>=need) || 16;
    hpCost = PRICES.heatPump[hpKw];
  }
  const total = other + hpElec;
  const baseline = other*i.price + fuelCost;
  // solar
  const ye = yld*i.orient;
  const target = total*(i.batt?1.0:0.8);
  let kwp = Math.min(target/ye, i.roof/A.m2PerKwp);
  let n = Math.round(kwp/PRICES.panelKwp);
  const maxN = Math.floor(i.roof/(A.m2PerKwp*PRICES.panelKwp));
  if(n<4) n = Math.min(4,maxN);
  if(n<2) n = 0;
  kwp = n*PRICES.panelKwp;
  const prod = kwp*ye;
  const dayLoad = total*i.day;
  const direct = prod>0 ? dayLoad*(1-Math.exp(-1.1*prod/dayLoad)) : 0;
  const surplus = prod-direct;
  let bk=0, shifted=0;
  if(i.batt && n>0){
    const nightDaily=(total-direct)/365;
    bk = Math.min(15, Math.max(5, Math.round(nightDaily*0.8/0.9/5)*5));
    shifted = Math.min(surplus*A.rt, bk*0.9*A.cycles, (total-direct)*0.85);
  }
  const exported = Math.max(0, surplus - shifted/A.rt);
  const gridImp = total - direct - shifted;
  const expVal = Math.min(exported*i.comp, gridImp*i.price*A.compCap);
  const newCost = gridImp*i.price - expVal;
  const gross = baseline - newCost;
  const hpSave = i.hp ? fuelCost - hpElec*i.price : 0;
  const solarSave = gross - hpSave;
  const rate = PRICES.pvPerKwp.find(([lim])=>kwp<=lim)[1];
  const pvCost = n>0 ? kwp*rate + PRICES.pvFixed : 0;
  const bCost = bk ? bk*PRICES.batteryPerKwh + PRICES.batteryFixed : 0;
  const invest = pvCost + bCost + hpCost;
  const maint = (n>0?PRICES.maintPv:0) + (i.hp?PRICES.maintHp:0);
  const cum=[-invest]; let payback=null;
  for(let y=1;y<=A.years;y++){
    const s = (hpSave + solarSave*Math.pow(1-A.deg,y-1))*Math.pow(1+A.esc,y-1) - maint;
    cum.push(cum[y-1]+s);
    if(payback===null && cum[y]>=0 && invest>0){ payback = y-1 + (-cum[y-1])/(cum[y]-cum[y-1]); }
  }
  const co2 = prod*A.gridCO2 + (i.hp ? fuelCO2 - hpElec*A.gridCO2 : 0);
  return {rname,annual,total,kwp,n,prod,selfShare:prod?(direct+shifted)/prod:0,bk,hpKw,invest,pvCost,bCost,hpCost,
          save1:gross-maint,net:cum[A.years],cum,payback,co2,hp:i.hp,valid:invest>0};
}
let last=null, lastIn=null;
function calc(){
  if(!$("#region").options.length) return;
  const t=T[lang], i=readInputs(), r=compute(i); last=r; lastIn=i;
  const dot=$("#vDot"), vt=$("#vText");
  if(!r.valid){
    dot.style.background="var(--line)"; vt.textContent=t.v_none;
    ["#mInvest","#mSaving","#mPayback","#mNet"].forEach(s=>$(s).textContent="–");
    $("#details").innerHTML=""; $("#cfChart").innerHTML=""; updateWa(); return;
  }
  const pb=r.payback;
  const v = pb!==null && pb<=8 ? ["var(--good)",t.v_good] : pb!==null && pb<=12 ? ["var(--warn)",t.v_ok] : ["var(--bad)",t.v_bad];
  dot.style.background=v[0]; vt.textContent=v[1];
  $("#mInvest").textContent=eur(r.invest);
  $("#mSaving").textContent=eur(r.save1);
  $("#mPayback").textContent= pb===null ? t.never : num(pb,1)+" "+t.years;
  $("#mNet").textContent=eur(r.net);
  const rows=[
    [t.d_pv, r.n ? `${num(r.kwp,2)} kWp, ${r.n} ${t.panels}` : t.none],
    ...(r.n ? [[t.d_prod, num(r.prod)+" kWh"],[t.d_self, num(r.selfShare*100)+" %"]] : []),
    [t.d_batt, r.bk ? r.bk+" kWh" : t.none],
    [t.d_hp, r.hp ? r.hpKw+" kW" : t.none],
    [t.d_co2, num(r.co2/1000,1)+" t"]
  ];
  $("#details").innerHTML = rows.map(([a,b])=>`<div><span>${a}</span><span>${b}</span></div>`).join("");
  drawCf(r.cum, pb);
  updateWa();
}
function drawCf(cum,pb){
  const W=560,H=220,pl=58,pr=8,pt=10,pb2=26;
  const mn=Math.min(0,...cum), mx=Math.max(0,...cum);
  const y=v=>pt+(mx-v)/(mx-mn||1)*(H-pt-pb2);
  const bw=(W-pl-pr)/cum.length;
  let s="";
  const ticks=[mn,0,mx].filter((v,k,a)=>a.indexOf(v)===k);
  ticks.forEach(v=>{s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" font-size="11" fill="var(--muted)" text-anchor="end">${eur(v)}</text>`});
  cum.forEach((v,k)=>{const x=pl+k*bw+1, h=Math.abs(y(v)-y(0)); s+=`<rect x="${x.toFixed(1)}" y="${Math.min(y(v),y(0)).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${Math.max(h,1).toFixed(1)}" rx="2" fill="${v<0?"#F0A515":"var(--accent)"}"/>`});
  [0,5,10,15,20,25].forEach(k=>{s+=`<text x="${pl+k*bw+bw/2}" y="${H-8}" font-size="11" fill="var(--muted)" text-anchor="middle">${k}</text>`});
  if(pb!==null){const x=pl+(pb+0.5)*bw; s+=`<line x1="${x}" x2="${x}" y1="${pt}" y2="${H-pb2}" stroke="var(--text)" stroke-dasharray="4 3"/>`;}
  $("#cfChart").innerHTML=s;
  $("#cfChart").setAttribute("aria-label", T[lang].chart_title);
}

function domeSVG(size=6, opts={}){
  const W=320,H=220, base=176, r = {5:72,6:84,8:100}[size]||84, cx=160;
  const P=(rad,deg)=>[cx+rad*Math.cos(deg*Math.PI/180), base-rad*Math.sin(deg*Math.PI/180)];
  const outer=[0,30,60,90,120,150,180].map(a=>P(r,a)), mid=[15,45,75,105,135,165].map(a=>P(r*.66,a)), top=[45,90,135].map(a=>P(r*.34,a));
  const L=(a,b)=>`M${a[0].toFixed(1)},${a[1].toFixed(1)}L${b[0].toFixed(1)},${b[1].toFixed(1)}`;
  let lines=[];
  for(let i=0;i<6;i++){lines.push(L(outer[i],mid[i]),L(outer[i+1],mid[i]));if(i<5)lines.push(L(mid[i],mid[i+1]));}
  [[0,1,0],[2,3,1],[4,5,2]].forEach(([a,b,c])=>{lines.push(L(mid[a],top[c]),L(mid[b],top[c]));});
  lines.push(L(top[0],top[1]),L(top[1],top[2]),L(mid[1],mid[2]),L(top[0],mid[2]),L(top[2],mid[3]),L(top[0],P(r*.66,75)),L(top[1],P(r,90)));
  const glow = opts.glow;
  const fill = glow ? "#F7D79A" : "var(--surface-2)";
  const dw=r*.32, dh=r*.55;
  const plat = opts.platform!==false ? `<rect x="${cx-r-20}" y="${base}" width="${2*r+40}" height="16" rx="2" fill="var(--wood)" stroke="var(--wood-line)" stroke-width="2"/>${Array.from({length:Math.round((2*r+40)/26)},(_,k)=>`<line x1="${cx-r-20+(k+1)*26}" y1="${base}" x2="${cx-r-20+(k+1)*26}" y2="${base+16}" stroke="var(--wood-line)" stroke-width="1.5"/>`).join("")}` : `<line x1="20" y1="${base}" x2="300" y2="${base}" stroke="currentColor" stroke-width="2"/>`;
  return `<svg class="ill" viewBox="0 0 ${W} ${H+20}" role="img" aria-label="Dome ${size} m">
   ${plat}
   <path d="M${cx-r},${base} A${r},${r} 0 0 1 ${cx+r},${base}Z" fill="${fill}" ${glow?'class="glow"':''}/>
   <path d="${lines.join("")}" stroke="${glow?"#0E213F":"#1E5EA6"}" stroke-opacity="${glow?.55:.8}" stroke-width="1.6" fill="none"/>
   <path d="M${cx-r},${base} A${r},${r} 0 0 1 ${cx+r},${base}" fill="none" stroke="${glow?"#F2F5FA":"currentColor"}" stroke-width="3"/>
   <rect x="${cx-dw/2-r*.18}" y="${base-dh}" width="${dw}" height="${dh}" rx="2" fill="${glow?"#F1A416":"var(--wood)"}" stroke="${glow?"#0E213F":"var(--wood-line)"}" stroke-width="2"/>
   <circle cx="${cx+r*.42}" cy="${base-r*.5}" r="${r*.17}" fill="${glow?"#FBE3B0":"var(--bg)"}" stroke="${glow?"#0E213F":"currentColor"}" stroke-width="2.5"/>
  </svg>`;
}

const key = (id,extras)=>id+"|"+extras.slice().sort().join(",");
function addToCart(id,extras=[],qty=1){
  const k=key(id,extras), ex=cart.find(l=>l.k===k);
  if(ex) ex.qty+=qty; else cart.push({k,id,extras:extras.slice(),qty});
  store.set("bl-cart",cart); updateCount(); renderCart(); showToast();
}
function lineUnit(l){ return byId(l.id).price + l.extras.reduce((s,e)=>s+EXTRAS[e].price,0); }
function totals(){
  let gross=0, disc=0;
  ["dome","reformer"].forEach(c=>{
    const lines=cart.filter(l=>byId(l.id).cat===c);
    const units=lines.reduce((s,l)=>s+l.qty,0), sum=lines.reduce((s,l)=>s+lineUnit(l)*l.qty,0);
    const rate=(VOLUME[c].find(([n])=>units>=n)||[0,0])[1];
    gross+=sum; disc+=sum*rate;
  });
  const total=gross-disc;
  return {gross,disc,total,net:total/(1+VAT),vat:total-total/(1+VAT)};
}

/* ===== Toast ===== */
let toastT;
function showToast(){ const el=$("#toast"); el.innerHTML=`<span>${t("added")}</span><a href="#cart">${t("go_cart")}</a>`; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,3200); }

/* ===== Router ===== */
const VIEWS=["home","shop","cart","how","business","contact","terms"];
const EVIEWS=["energy","energy-homes","energy-sourcing","energy-partners","energy-contact"];
function route(){
  const h=location.hash.slice(1);
  let v = (VIEWS.includes(h)||EVIEWS.includes(h))?h:"home";
  if(v==="cart") v="shop";
  if(h.startsWith("p-") && byId(h.slice(2))){ v="product"; if(currentProduct!==h.slice(2)){currentProduct=h.slice(2); pdState={extras:[],qty:1};} renderProduct(currentProduct); }
  else currentProduct=null;
  $$("[data-view]").forEach(el=>el.hidden=el.dataset.view!==v);
  $$("[data-route]").forEach(a=>{ const on=a.dataset.route===v||(v==="product"&&a.dataset.route==="shop"); if(on) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  const en=EVIEWS.includes(v);
  document.documentElement.dataset.brand = en?"energy":"logistics";
  $$("[data-sub]").forEach(a=>{ if(a.dataset.sub===v) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  $("#ctaBand").hidden = true;
  $("#eCtaBand").hidden = true;
  setBrandUI();
  $("#mainNav").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded","false");
  if(v==="cart") renderCart();
  window.scrollTo(0,0);
}

/* ===== Events ===== */
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-add]"); if(a){ addToCart(a.dataset.add); return; }
  const f=e.target.closest("[data-filter]"); if(f){ filter=f.dataset.filter; renderGrid(); return; }
  const fl=e.target.closest("[data-filter-link]"); if(fl){ filter=fl.dataset.filterLink; renderGrid(); }
  const q=e.target.closest("[data-q]"); if(q){ const [i,d]=q.dataset.q.split("|").map(Number); cart[i].qty=Math.max(1,cart[i].qty+d); store.set("bl-cart",cart); renderCart(); updateCount(); return; }
  const rm=e.target.closest("[data-rm]"); if(rm){ cart.splice(+rm.dataset.rm,1); store.set("bl-cart",cart); renderCart(); updateCount(); return; }
  const pq=e.target.closest("[data-pdq]"); if(pq){ pdState.qty=Math.max(1,pdState.qty+ +pq.dataset.pdq); renderProduct(currentProduct); return; }
  if(e.target.closest("#pdAdd")){ addToCart(currentProduct,pdState.extras,pdState.qty); return; }
  if(e.target.closest("#coSend")){ sendOrder(); return; }
  const lb=e.target.closest("[data-lang]"); if(lb){ lang=lb.dataset.lang; store.set("bl-lang",lang); applyLang(); return; }
  const mb=e.target.closest("[data-mode]"); if(mb){ mode=mb.dataset.mode; store.set("bl-mode",mode); coState.business=mode==="b2b"; $$("[data-mode]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.mode===mode))); renderAll(); return; }
});
document.addEventListener("change",e=>{
  if(e.target.matches("[data-extra]")){ const x=e.target.dataset.extra; pdState.extras = e.target.checked ? [...pdState.extras,x] : pdState.extras.filter(y=>y!==x); renderProduct(currentProduct); }
  if(e.target.id==="coBiz"){ coState.business=e.target.checked; $("#bizFields").hidden=!e.target.checked; }
});
$("#menuBtn").addEventListener("click",()=>{ const o=$("#mainNav").classList.toggle("open"); $("#menuBtn").setAttribute("aria-expanded",String(o)); });
window.addEventListener("hashchange",route);
document.documentElement.dataset.brand="logistics";
applyLang(); route();
</script>
</body>
</html>
