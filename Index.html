<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bruna Logistics – Directo de fábrica</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;--surface:#F1F4F9;--surface-2:#E3E9F2;--text:#0E213F;--muted:#4A5A72;--line:#D3DBE7;
  --accent:#1E5EA6;--accent-text:#1E5EA6;--sky:#498ED9;--amber:#F1A416;--wood:#E6C9A2;--wood-line:#A97A46;
  --deep:#0E213F;--on-deep:#F2F5FA;--on-deep-muted:#A8B7CE;--good:#1D7A4E;--bad:#B0392B;--amber-text:#8F5D00;--warn:#8F5D00;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1426;--surface:#101D35;--surface-2:#172745;--text:#E6ECF5;--muted:#9DABC2;--line:#24365A;
  --accent:#498ED9;--accent-text:#7FB2EC;--deep:#071021;--good:#5CC793;--bad:#F08C7A;--amber-text:#F3B53A;--warn:#F3B53A;--wood:#6B5136;--wood-line:#C99A62;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0A1426;--surface:#101D35;--surface-2:#172745;--text:#E6ECF5;--muted:#9DABC2;--line:#24365A;
  --accent:#498ED9;--accent-text:#7FB2EC;--deep:#071021;--good:#5CC793;--bad:#F08C7A;--amber-text:#F3B53A;--warn:#F3B53A;--wood:#6B5136;--wood-line:#C99A62;color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Archivo","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:17px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
img,svg{max-width:100%}
h1,h2,h3{font-stretch:112%;line-height:1.08;letter-spacing:-.015em;margin:0}
h2{font-size:clamp(1.75rem,3.2vw,2.6rem);font-weight:780}
h3{font-size:1.2rem;font-weight:700;letter-spacing:0}
p{margin:0}
a{color:var(--accent-text)}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.lead{font-size:1.15rem;color:var(--muted);max-width:60ch}
.ill{color:var(--text)}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr{display:flex;align-items:center;gap:14px;height:72px;max-width:1360px}
@media (max-width:440px){.hdr .brand .wm{display:none}.hdr{gap:10px}}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text);flex:none}
.mark{width:40px;height:40px;flex:none}
.mark .gap{stroke:var(--bg)}
.wm{display:flex;flex-direction:column;line-height:1}
.wm b{font-weight:850;font-stretch:108%;font-size:1.35rem;letter-spacing:.01em}
.wm small{font-size:.6rem;letter-spacing:.4em;color:var(--accent-text);margin-top:4px;font-weight:500}
.wm.zh b{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;font-size:1.45rem;letter-spacing:.05em}
.wm.zh small{letter-spacing:.12em;color:var(--text);font-weight:700}
.wm.zh small span{color:var(--accent-text);font-weight:500}
nav.main{display:flex;gap:4px;margin-left:auto;align-items:center}
nav.main a,.dd-btn,.pill-group button{white-space:nowrap}
nav.main a{padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--text);font-weight:500;font-size:.96rem}
nav.main a:hover{background:var(--surface)}
nav.main a[aria-current="page"]{background:var(--surface-2)}
.pill-group{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.pill-group button{border:0;background:none;color:var(--muted);font:inherit;font-size:.85rem;padding:5px 10px;border-radius:999px;cursor:pointer}
.pill-group button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.cart-btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--text);background:none;color:var(--text);font:inherit;font-weight:600;padding:7px 14px;border-radius:999px;text-decoration:none;flex:none}
.cart-btn .n{background:var(--amber);color:#0E213F;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:.8rem;padding:0 6px}
.menu-btn{display:none;border:1px solid var(--line);background:none;color:var(--text);font:inherit;padding:8px 14px;border-radius:999px}
@media (max-width:1279px){
  .menu-btn{display:block;margin-left:auto}
  nav.main{display:none;position:absolute;left:0;right:0;top:72px;background:var(--bg);flex-direction:column;align-items:stretch;padding:12px 24px 20px;border-bottom:1px solid var(--line)}
  nav.main.open{display:flex}
  nav.main .pill-group{align-self:flex-start;margin-top:8px}
}
@media (max-width:520px){.wm small{display:none}.cart-btn .lbl{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55em;padding:.85em 1.35em;border-radius:999px;font:inherit;font-weight:650;text-decoration:none;cursor:pointer;border:1.5px solid transparent;font-size:1rem}
.btn-amber{background:var(--amber);color:#0E213F}
.btn-amber:hover{background:#F6B53A}
.btn-line{border-color:currentColor;color:inherit;background:none}
.btn-blue{background:var(--accent);color:#fff}
.btn-sm{padding:.55em 1em;font-size:.92rem}
.btns{display:flex;flex-wrap:wrap;gap:12px}

/* hero */
.hero{background:var(--deep);color:var(--on-deep);padding:64px 0 0;overflow:hidden}
.hero .mark .gap{stroke:var(--deep)}
.hero-grid{display:grid;grid-template-columns:1fr 1.05fr;gap:40px;align-items:end}
.hero-text{padding-bottom:64px}
.hero h1{font-size:clamp(2.3rem,4.8vw,4rem);font-weight:820;max-width:14ch}
.hero p.sub{margin:24px 0 32px;font-size:1.15rem;color:var(--on-deep-muted);max-width:50ch}
.hero-ill svg{display:block;width:100%;height:auto}
.glow{animation:glow 1.2s .2s ease-out both}
@keyframes glow{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.glow{animation:none}}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}.hero-text{padding-bottom:0}}

section.block{padding:88px 0}
section.alt{background:var(--surface)}
.head{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:end;margin-bottom:40px}
@media (max-width:800px){.head{grid-template-columns:1fr;gap:16px}}

/* categories */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.cat{display:grid;grid-template-rows:auto 1fr;border:1px solid var(--line);border-radius:28px;overflow:hidden;text-decoration:none;color:var(--text);background:var(--bg)}
.cat .pic{background:var(--surface);padding:28px 28px 0;display:flex;align-items:flex-end;justify-content:center;min-height:240px}
.cat .pic svg{width:100%;max-width:420px;height:auto}
.cat .body{padding:24px 28px 28px;display:flex;justify-content:space-between;gap:16px;align-items:end;flex-wrap:wrap}
.cat .body p{color:var(--muted);margin-top:6px}
.cat .price{font-weight:700;font-size:1.05rem;white-space:nowrap}
.cat:hover{border-color:var(--accent)}
@media (max-width:760px){.cats{grid-template-columns:1fr}}

/* included */
.incl{display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
.incl div{border-top:3px solid var(--amber);padding-top:14px}
.incl p{color:var(--muted);margin-top:8px;font-size:.96rem}
@media (max-width:900px){.incl{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.incl{grid-template-columns:1fr}}

/* route */
.route svg{display:block;width:100%;height:auto}
ol.lsteps{list-style:none;margin:28px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:24px;counter-reset:s}
ol.lsteps li{counter-increment:s}
ol.lsteps h3::before{content:counter(s) ". ";color:var(--accent-text)}
ol.lsteps p{color:var(--muted);margin-top:8px;font-size:.96rem}
@media (max-width:860px){ol.lsteps{grid-template-columns:1fr 1fr}}
@media (max-width:520px){ol.lsteps{grid-template-columns:1fr}}

.b2b-band{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center;background:var(--surface);border-radius:28px;padding:44px}
.b2b-band p{color:var(--muted);margin:14px 0 24px}
@media (max-width:800px){.b2b-band{grid-template-columns:1fr;padding:28px}}

.cta{background:var(--deep);color:var(--on-deep);padding:72px 0}
.cta-grid{display:flex;justify-content:space-between;gap:32px;align-items:end;flex-wrap:wrap}
.cta p{color:var(--on-deep-muted);margin-top:12px}

/* pages */
.page-head{padding:56px 0 32px}
.page-head h1{font-size:clamp(2.1rem,4.4vw,3.4rem);font-weight:820;max-width:22ch}
.page-head .lead{margin-top:16px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.filters button{border:1.5px solid var(--line);background:none;color:var(--text);font:inherit;padding:8px 16px;border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding-bottom:88px}
@media (max-width:960px){.grid{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.grid{grid-template-columns:1fr}}
.prod{border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
.prod .pic{background:var(--surface);padding:22px 22px 6px;display:block}
.prod .pic svg{display:block;width:100%;height:auto}
.prod .body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.prod .body p{color:var(--muted);font-size:.95rem;flex:1}
.prod h3 a{color:inherit;text-decoration:none}
.prod h3 a:hover{text-decoration:underline}
.pricebox{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.pricebox strong{font-size:1.4rem;font-weight:800;font-stretch:108%;font-variant-numeric:tabular-nums}
.pricebox span{font-size:.85rem;color:var(--muted)}
.prod .btns{margin-top:6px}

.pd{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:start;padding-bottom:88px}
@media (max-width:900px){.pd{grid-template-columns:1fr}}
.pd .pic{background:var(--surface);border-radius:28px;padding:36px 32px 12px}
.pd .pic svg{display:block;width:100%;height:auto}
.backlink{display:inline-block;margin:28px 0 8px;color:var(--muted);text-decoration:none}
.backlink:hover{color:var(--text)}
.pd h1{font-size:clamp(2rem,3.6vw,2.8rem);font-weight:820}
.pd .desc{color:var(--muted);margin:14px 0 18px;font-size:1.08rem}
.opt{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.opt label{display:flex;gap:10px;align-items:center;cursor:pointer}
.opt input{width:20px;height:20px;accent-color:var(--accent)}
.opt span.p{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px}
.qty button{border:0;background:none;color:var(--text);font:inherit;font-size:1.1rem;width:38px;height:38px;cursor:pointer;border-radius:999px}
.qty span{min-width:28px;text-align:center;font-weight:650;font-variant-numeric:tabular-nums}
.buyrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:22px 0 14px}
.note{font-size:.88rem;color:var(--muted)}
.info{margin-top:18px;padding:16px 18px;background:var(--surface);border-radius:16px;font-size:.94rem;display:grid;gap:8px}
.specs{width:100%;border-collapse:collapse;margin-top:12px;font-size:.95rem}
.specs th,.specs td{text-align:left;padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.specs th{font-weight:500;color:var(--muted);width:40%;padding-right:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:600;z-index:30;display:flex;gap:14px;align-items:center}
.toast a{color:var(--amber)}

/* cart */
.cartlay{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:start;padding-bottom:88px}
@media (max-width:920px){.cartlay{grid-template-columns:1fr}}
.line{display:grid;grid-template-columns:96px 1fr auto;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);align-items:center}
.line .thumb{background:var(--surface);border-radius:14px;padding:8px}
.line .thumb svg{display:block;width:100%;height:auto}
.line .meta p{color:var(--muted);font-size:.88rem;margin-top:4px}
.line .right{text-align:right;display:grid;gap:8px;justify-items:end}
.line .right strong{font-variant-numeric:tabular-nums}
.linkbtn{border:0;background:none;color:var(--muted);font:inherit;font-size:.85rem;text-decoration:underline;cursor:pointer;padding:0}
.sum{background:var(--surface);border-radius:24px;padding:26px}
.sum .row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-variant-numeric:tabular-nums}
.sum .row.total{border-top:1px solid var(--line);margin-top:8px;padding-top:14px;font-weight:800;font-size:1.25rem}
.sum .row.disc{color:var(--good)}
.sum .row.small{font-size:.88rem;color:var(--muted)}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-weight:550;font-size:.92rem}
input[type=text],input[type=email],input[type=tel]{font:inherit;color:var(--text);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
input:focus{border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;cursor:pointer;margin:10px 0}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.msg{margin-top:12px;font-size:.92rem;font-weight:600}
.msg.err{color:var(--bad)}.msg.ok{color:var(--good)}
.empty{padding:40px 0 80px}
.empty p{color:var(--muted);margin:10px 0 22px}

/* how / business */
.faq{display:grid;grid-template-columns:1fr 1fr;gap:0 48px}
.faq div{padding:22px 0;border-top:1px solid var(--line)}
.faq p{color:var(--muted);margin-top:8px}
@media (max-width:760px){.faq{grid-template-columns:1fr}}
.feats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.feat{border:1px solid var(--line);border-radius:20px;padding:24px;background:var(--bg)}
.feat p{color:var(--muted);margin-top:10px;font-size:.96rem}
@media (max-width:900px){.feats{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.feats{grid-template-columns:1fr}}
table.vol{border-collapse:collapse;min-width:420px}
table.vol th,table.vol td{padding:12px 18px 12px 0;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
table.vol th{color:var(--muted);font-weight:500}
.scroll-x{overflow-x:auto}
.channels{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;padding-bottom:88px}
.channel{display:block;border:1px solid var(--line);border-radius:20px;padding:24px;text-decoration:none;color:var(--text);background:var(--bg)}
a.channel:hover{border-color:var(--accent)}
.channel h3{margin:14px 0 6px}
.channel p{color:var(--muted);font-size:.95rem}
.channel .val{display:block;margin-top:12px;font-weight:650;color:var(--accent-text)}
.channel svg{width:30px;height:30px;color:var(--accent-text)}
ul.legal{padding-left:20px;max-width:70ch;padding-bottom:88px}
ul.legal li{margin-bottom:12px;color:var(--muted)}

footer{border-top:1px solid var(--line);padding:40px 0;font-size:.9rem;color:var(--muted)}
.foot{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:center}
.foot nav{display:flex;gap:18px}
.foot a{color:var(--muted)}
.draftnote{margin-top:16px;font-size:.82rem}
/* ===== Bruna Energy (scoped) ===== */
.energy .btn{display:inline-flex;align-items:center;gap:.55em;padding:.85em 1.35em;border-radius:999px;font:inherit;font-weight:650;text-decoration:none;cursor:pointer;border:1.5px solid transparent;font-size:1rem}
.energy .btn-amber{background:var(--amber);color:#10291F}
.energy .btn-amber:hover{background:#F6B634}
.energy .btn-line{border-color:currentColor;color:inherit;background:none}
.energy .btn-green{background:var(--accent);color:#fff}
.energy .btns{display:flex;flex-wrap:wrap;gap:12px}
.energy .hero{background:var(--deep);color:var(--on-deep);padding:72px 0 56px}
.energy .hero .mark .gap{stroke:var(--deep)}
.energy .hero-grid{display:grid;grid-template-columns:1.02fr 1fr;gap:56px;align-items:center}
.energy .hero h1{font-size:clamp(2.3rem,4.8vw,4rem);font-weight:820;max-width:15ch}
.energy .hero p.sub{margin:24px 0 32px;font-size:1.15rem;color:var(--on-deep-muted);max-width:52ch}
.energy .daychart{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:20px 20px 16px}
.energy .daychart svg{display:block;width:100%;height:auto}
.energy .daychart figcaption{color:var(--on-deep-muted);font-size:.9rem;margin-top:10px}
.energy .legend{display:flex;gap:18px;flex-wrap:wrap;font-size:.85rem;color:var(--on-deep);margin-bottom:8px}
.energy .legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
.energy .loadline{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.8s .3s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.energy .loadline{animation:none;stroke-dashoffset:0}}
@media (max-width:900px){.energy .hero-grid{grid-template-columns:1fr;gap:40px}}
.energy section.block{padding:88px 0}
.energy section.alt{background:var(--surface)}
.energy .head{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:end;margin-bottom:40px}
@media (max-width:800px){.energy .head{grid-template-columns:1fr;gap:16px}}
.energy .svc{display:grid;grid-template-columns:72px minmax(180px,.8fr) 1.4fr;gap:28px;padding:28px 0;border-top:1px solid var(--line);align-items:start}
.energy .svc:last-child{border-bottom:1px solid var(--line)}
.energy .svc svg{width:56px;height:56px;color:var(--accent-text)}
.energy .svc p{color:var(--muted)}
@media (max-width:700px){.energy .svc{grid-template-columns:56px 1fr;gap:16px}
.energy .svc p{grid-column:2}}
.energy .promise{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.energy .promise p.lead{margin-top:20px}
.energy .ticket{background:var(--bg);border:1px solid var(--line);border-radius:24px;padding:32px;position:relative}
.energy .ticket .tag{display:inline-block;font-size:.8rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin-bottom:16px}
.energy .ticket .big{font-size:clamp(3rem,7vw,5rem);font-weight:850;font-stretch:115%;line-height:1;color:var(--bad);margin:18px 0 4px}
.energy .ticket .biglabel{color:var(--muted)}
.energy .ticket .reco{margin-top:20px;padding-top:18px;border-top:1px dashed var(--line);font-weight:600;display:flex;gap:10px}
.energy .ticket .reco svg{flex:none;width:22px;height:22px;color:var(--good)}
@media (max-width:800px){.energy .promise{grid-template-columns:1fr}}
.energy ol.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:24px;counter-reset:s}
.energy ol.steps li{counter-increment:s;position:relative;padding-top:56px}
.energy ol.steps li::before{content:counter(s);position:absolute;top:0;left:0;width:40px;height:40px;border-radius:50%;background:var(--deep);color:#fff;display:grid;place-items:center;font-weight:700}
.energy ol.steps li::after{content:"";position:absolute;top:20px;left:48px;right:-16px;height:2px;background:var(--line)}
.energy ol.steps li:last-child::after{display:none}
.energy ol.steps p{color:var(--muted);margin-top:8px;font-size:.96rem}
@media (max-width:900px){.energy ol.steps{grid-template-columns:1fr 1fr}
.energy ol.steps li::after{display:none}}
@media (max-width:520px){.energy ol.steps{grid-template-columns:1fr}}

/* ===== Hero day chart ===== */
function buildDayChart(){
  const W=560,H=300,px=36,top=16,bot=34;
  const x = t => px + t/24*(W-px-10);
  const y = v => H-bot - v/110*(H-bot-top);
  const L = t => 18 + 58/(1+Math.exp(-(t-7)*2.5)) * 1/(1+Math.exp((t-20.3)*2.2)) + 30*Math.exp(-(((t-18.6)/1.25)**2));
  const S = t => (t<6.6||t>20.4) ? 0 : 100*Math.pow(Math.sin(Math.PI*(t-6.6)/13.8),1.6);
  const pts=[]; for(let t=0;t<=24.001;t+=0.25) pts.push(t);
  const sol = "M"+x(6.6)+","+y(0)+" "+pts.filter(t=>t>=6.6&&t<=20.4).map(t=>"L"+x(t).toFixed(1)+","+y(S(t)).toFixed(1)).join(" ")+" L"+x(20.4)+","+y(0)+"Z";
  const bt = pts.filter(t=>t>=16 && t<=21.5 && L(t)>S(t));
  const bat = "M"+bt.map(t=>x(t).toFixed(1)+","+y(Math.min(L(t), S(t)+ (L(t)-S(t)))).toFixed(1)).join(" L")+" L"+bt.slice().reverse().map(t=>x(t).toFixed(1)+","+y(S(t)).toFixed(1)).join(" L")+"Z";
  const load = "M"+pts.map(t=>x(t).toFixed(1)+","+y(L(t)).toFixed(1)).join(" L");
  let grid="";
  [0,6,12,18,24].forEach(h=>{grid+=`<line x1="${x(h)}" x2="${x(h)}" y1="${top}" y2="${H-bot}" stroke="rgba(255,255,255,.08)"/><text x="${x(h)}" y="${H-12}" fill="#A6BFB3" font-size="12" text-anchor="middle">${String(h).padStart(2,"0")}:00</text>`});
  $("#dayChart").innerHTML = `${grid}<line x1="${px}" x2="${W-10}" y1="${y(0)}" y2="${y(0)}" stroke="rgba(255,255,255,.25)"/>
    <path d="${sol}" fill="#2AA47E" opacity=".6"/>
    <path d="${bat}" fill="#F0A515" opacity=".9"/>
    <path class="loadline" d="${load}" fill="none" stroke="#F3F7F4" stroke-width="2.5" stroke-linejoin="round"/>`;
}

/* ===== Calculator ===== */
function readInputs(){
  const r = REGIONS[+$("#region").value];
  return {
    region:r, mode:document.querySelector('input[name=cmode]:checked').value,
    bill:+$("#bill").value||0, kwh:+$("#kwh").value||0,
    day:+document.querySelector('input[name=day]:checked').value,
    price:+$("#price").value||0.18, comp:+$("#comp").value||0,
    roof:+$("#roof").value||0, orient:+document.querySelector('input[name=orient]:checked').value,
    batt:$("#batt").checked, hp:$("#hp").checked, fuel:$("#fuel").value,
    area:+$("#area").value||0, ins:+document.querySelector('input[name=ins]:checked').value, dhw:$("#dhw").checked
  };
}
function compute(i){
  const [rname,yld,heat,wm2] = i.region;
  const annual = i.mode==="bill" ? i.bill*12*(1-A.fixedShare)/i.price : i.kwh;
  let other = annual, fuelCost=0, hpElec=0, fuelCO2=0, hpKw=0, hpCost=0, demand=0;
  if(i.hp){
    demand = i.area*heat*i.ins + (i.dhw?1800:0);
    const scop = heat<60 ? 3.4 : 3.0;
    hpElec = demand/scop;
    const f = FUELS[i.fuel];
    if(i.fuel==="electric"){ const heatE=Math.min(demand, annual*0.7); other=annual-heatE; fuelCost=heatE*i.price; fuelCO2=heatE*A.gridCO2; hpElec=heatE/scop; }
    else { fuelCost = demand/f.eff*f.p; fuelCO2 = demand/f.eff*f.co2; }
    const need = i.area*wm2*i.ins/1000 + (i.dhw?1:0);
    hpKw = [6,9,12,16].find(k=>k>=need) || 16;
    hpCost = PRICES.heatPump[hpKw];
  }
  const total = other + hpElec;
  const baseline = other*i.price + fuelCost;
  // solar
  const ye = yld*i.orient;
  const target = total*(i.batt?1.0:0.8);
  let kwp = Math.min(target/ye, i.roof/A.m2PerKwp);
  let n = Math.round(kwp/PRICES.panelKwp);
  const maxN = Math.floor(i.roof/(A.m2PerKwp*PRICES.panelKwp));
  if(n<4) n = Math.min(4,maxN);
  if(n<2) n = 0;
  kwp = n*PRICES.panelKwp;
  const prod = kwp*ye;
  const dayLoad = total*i.day;
  const direct = prod>0 ? dayLoad*(1-Math.exp(-1.1*prod/dayLoad)) : 0;
  const surplus = prod-direct;
  let bk=0, shifted=0;
  if(i.batt && n>0){
    const nightDaily=(total-direct)/365;
    bk = Math.min(15, Math.max(5, Math.round(nightDaily*0.8/0.9/5)*5));
    shifted = Math.min(surplus*A.rt, bk*0.9*A.cycles, (total-direct)*0.85);
  }
  const exported = Math.max(0, surplus - shifted/A.rt);
  const gridImp = total - direct - shifted;
  const expVal = Math.min(exported*i.comp, gridImp*i.price*A.compCap);
  const newCost = gridImp*i.price - expVal;
  const gross = baseline - newCost;
  const hpSave = i.hp ? fuelCost - hpElec*i.price : 0;
  const solarSave = gross - hpSave;
  const rate = PRICES.pvPerKwp.find(([lim])=>kwp<=lim)[1];
  const pvCost = n>0 ? kwp*rate + PRICES.pvFixed : 0;
  const bCost = bk ? bk*PRICES.batteryPerKwh + PRICES.batteryFixed : 0;
  const invest = pvCost + bCost + hpCost;
  const maint = (n>0?PRICES.maintPv:0) + (i.hp?PRICES.maintHp:0);
  const cum=[-invest]; let payback=null;
  for(let y=1;y<=A.years;y++){
    const s = (hpSave + solarSave*Math.pow(1-A.deg,y-1))*Math.pow(1+A.esc,y-1) - maint;
    cum.push(cum[y-1]+s);
    if(payback===null && cum[y]>=0 && invest>0){ payback = y-1 + (-cum[y-1])/(cum[y]-cum[y-1]); }
  }
  const co2 = prod*A.gridCO2 + (i.hp ? fuelCO2 - hpElec*A.gridCO2 : 0);
  return {rname,annual,total,kwp,n,prod,selfShare:prod?(direct+shifted)/prod:0,bk,hpKw,invest,pvCost,bCost,hpCost,
          save1:gross-maint,net:cum[A.years],cum,payback,co2,hp:i.hp,valid:invest>0};
}
let last=null, lastIn=null;
function calc(){
  if(!$("#region").options.length) return;
  const t=T[lang], i=readInputs(), r=compute(i); last=r; lastIn=i;
  const dot=$("#vDot"), vt=$("#vText");
  if(!r.valid){
    dot.style.background="var(--line)"; vt.textContent=t.v_none;
    ["#mInvest","#mSaving","#mPayback","#mNet"].forEach(s=>$(s).textContent="–");
    $("#details").innerHTML=""; $("#cfChart").innerHTML=""; updateWa(); return;
  }
  const pb=r.payback;
  const v = pb!==null && pb<=8 ? ["var(--good)",t.v_good] : pb!==null && pb<=12 ? ["var(--warn)",t.v_ok] : ["var(--bad)",t.v_bad];
  dot.style.background=v[0]; vt.textContent=v[1];
  $("#mInvest").textContent=eur(r.invest);
  $("#mSaving").textContent=eur(r.save1);
  $("#mPayback").textContent= pb===null ? t.never : num(pb,1)+" "+t.years;
  $("#mNet").textContent=eur(r.net);
  const rows=[
    [t.d_pv, r.n ? `${num(r.kwp,2)} kWp, ${r.n} ${t.panels}` : t.none],
    ...(r.n ? [[t.d_prod, num(r.prod)+" kWh"],[t.d_self, num(r.selfShare*100)+" %"]] : []),
    [t.d_batt, r.bk ? r.bk+" kWh" : t.none],
    [t.d_hp, r.hp ? r.hpKw+" kW" : t.none],
    [t.d_co2, num(r.co2/1000,1)+" t"]
  ];
  $("#details").innerHTML = rows.map(([a,b])=>`<div><span>${a}</span><span>${b}</span></div>`).join("");
  drawCf(r.cum, pb);
  updateWa();
}
function drawCf(cum,pb){
  const W=560,H=220,pl=58,pr=8,pt=10,pb2=26;
  const mn=Math.min(0,...cum), mx=Math.max(0,...cum);
  const y=v=>pt+(mx-v)/(mx-mn||1)*(H-pt-pb2);
  const bw=(W-pl-pr)/cum.length;
  let s="";
  const ticks=[mn,0,mx].filter((v,k,a)=>a.indexOf(v)===k);
  ticks.forEach(v=>{s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" font-size="11" fill="var(--muted)" text-anchor="end">${eur(v)}</text>`});
  cum.forEach((v,k)=>{const x=pl+k*bw+1, h=Math.abs(y(v)-y(0)); s+=`<rect x="${x.toFixed(1)}" y="${Math.min(y(v),y(0)).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${Math.max(h,1).toFixed(1)}" rx="2" fill="${v<0?"#F0A515":"var(--accent)"}"/>`});
  [0,5,10,15,20,25].forEach(k=>{s+=`<text x="${pl+k*bw+bw/2}" y="${H-8}" font-size="11" fill="var(--muted)" text-anchor="middle">${k}</text>`});
  if(pb!==null){const x=pl+(pb+0.5)*bw; s+=`<line x1="${x}" x2="${x}" y1="${pt}" y2="${H-pb2}" stroke="var(--text)" stroke-dasharray="4 3"/>`;}
  $("#cfChart").innerHTML=s;
  $("#cfChart").setAttribute("aria-label", T[lang].chart_title);
}
function summaryText(){
  const t=T[lang], r=last; if(!r||!r.valid) return t.wa_msg;
  return `${t.wa_msg} ${r.rname}; ${t.d_pv}: ${r.n?num(r.kwp,2)+" kWp":t.none}; ${t.d_batt}: ${r.bk?r.bk+" kWh":t.none}; ${t.d_hp}: ${r.hp?r.hpKw+" kW":t.none}; ${t.m_invest}: ${eur(r.invest)}; ${t.m_saving}: ${eur(r.save1)}; ${t.m_payback}: ${r.payback===null?t.never:num(r.payback,1)+" "+t.years}.`;

  sec(P.inputs);

  yy+=4; sec(P.results);
  row(t.d_pv, r.n?`${n(r.kwp,2)} kWp, ${r.n} ${t.panels}`:t.none);
  if(r.n){ row(t.d_prod, n(r.prod)+" kWh"); row(t.d_self, n(r.selfShare*100)+" %"); }
  row(t.d_batt, r.bk?r.bk+" kWh":t.none); row(t.d_hp, r.hp?r.hpKw+" kW":t.none);
  row(t.m_invest, pdfEur(r.invest,l)); row(t.m_saving, pdfEur(r.save1,l));
  row(t.m_payback, r.payback===null?t.never:n(r.payback,1)+" "+t.years); row(t.m_net, pdfEur(r.net,l));
  row(t.d_co2.replace("₂","2"), n(r.co2/1000,1)+" t");
  yy+=4; sec(P.assumptions); doc.setFontSize(9.5); doc.setTextColor(76,97,87);

  const t=T[lang], msg=$("#leadMsg");

  if(!name || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) || !$("#c1").checked){ msg.textContent=t.e_fields; msg.classList.add("err"); return; }

/* ===== Illustrations (original line drawings) ===== */
function domeSVG(size=6, opts={}){
  const W=320,H=220, base=176, r = {5:72,6:84,8:100}[size]||84, cx=160;
  const P=(rad,deg)=>[cx+rad*Math.cos(deg*Math.PI/180), base-rad*Math.sin(deg*Math.PI/180)];
  const outer=[0,30,60,90,120,150,180].map(a=>P(r,a)), mid=[15,45,75,105,135,165].map(a=>P(r*.66,a)), top=[45,90,135].map(a=>P(r*.34,a));
  const L=(a,b)=>`M${a[0].toFixed(1)},${a[1].toFixed(1)}L${b[0].toFixed(1)},${b[1].toFixed(1)}`;
  let lines=[];
  for(let i=0;i<6;i++){lines.push(L(outer[i],mid[i]),L(outer[i+1],mid[i]));if(i<5)lines.push(L(mid[i],mid[i+1]));}
  [[0,1,0],[2,3,1],[4,5,2]].forEach(([a,b,c])=>{lines.push(L(mid[a],top[c]),L(mid[b],top[c]));});
  lines.push(L(top[0],top[1]),L(top[1],top[2]),L(mid[1],mid[2]),L(top[0],mid[2]),L(top[2],mid[3]),L(top[0],P(r*.66,75)),L(top[1],P(r,90)));
  const glow = opts.glow;
  const fill = glow ? "#F7D79A" : "var(--surface-2)";
  const dw=r*.32, dh=r*.55;
  const plat = opts.platform!==false ? `<rect x="${cx-r-20}" y="${base}" width="${2*r+40}" height="16" rx="2" fill="var(--wood)" stroke="var(--wood-line)" stroke-width="2"/>${Array.from({length:Math.round((2*r+40)/26)},(_,k)=>`<line x1="${cx-r-20+(k+1)*26}" y1="${base}" x2="${cx-r-20+(k+1)*26}" y2="${base+16}" stroke="var(--wood-line)" stroke-width="1.5"/>`).join("")}` : `<line x1="20" y1="${base}" x2="300" y2="${base}" stroke="currentColor" stroke-width="2"/>`;
  return `<svg class="ill" viewBox="0 0 ${W} ${H+20}" role="img" aria-label="Dome ${size} m">
   ${plat}
   <path d="M${cx-r},${base} A${r},${r} 0 0 1 ${cx+r},${base}Z" fill="${fill}" ${glow?'class="glow"':''}/>
   <path d="${lines.join("")}" stroke="${glow?"#0E213F":"#1E5EA6"}" stroke-opacity="${glow?.55:.8}" stroke-width="1.6" fill="none"/>
   <path d="M${cx-r},${base} A${r},${r} 0 0 1 ${cx+r},${base}" fill="none" stroke="${glow?"#F2F5FA":"currentColor"}" stroke-width="3"/>
   <rect x="${cx-dw/2-r*.18}" y="${base-dh}" width="${dw}" height="${dh}" rx="2" fill="${glow?"#F1A416":"var(--wood)"}" stroke="${glow?"#0E213F":"var(--wood-line)"}" stroke-width="2"/>
   <circle cx="${cx+r*.42}" cy="${base-r*.5}" r="${r*.17}" fill="${glow?"#FBE3B0":"var(--bg)"}" stroke="${glow?"#0E213F":"currentColor"}" stroke-width="2.5"/>
  </svg>`;
}

     <span>${t("qty")}</span>

     <button class="btn btn-amber" id="pdAdd">${t("add")}</button>
    </div>
    <div class="info"><span>${t("pd_import")}</span><span>${t("pd_delivery")}</span><span>${t("pd_vol")}</span></div>
    <h3 style="margin-top:28px">${t("specs")}</h3>
    <table class="specs">${specRows(p).map(([a,b])=>`<tr><th>${a}</th><td>${b}</td></tr>`).join("")}</table>
    <p class="note" style="margin-top:10px">${t("specs_note")}</p>
   </div>`;
}

/* ===== Cart ===== */
const key = (id,extras)=>id+"|"+extras.slice().sort().join(",");
function addToCart(id,extras=[],qty=1){
  const k=key(id,extras), ex=cart.find(l=>l.k===k);
  if(ex) ex.qty+=qty; else cart.push({k,id,extras:extras.slice(),qty});
  store.set("bl-cart",cart); updateCount(); renderCart(); showToast();
}
function lineUnit(l){ return byId(l.id).price + l.extras.reduce((s,e)=>s+EXTRAS[e].price,0); }
function totals(){
  let gross=0, disc=0;
  ["dome","reformer"].forEach(c=>{
    const lines=cart.filter(l=>byId(l.id).cat===c);
    const units=lines.reduce((s,l)=>s+l.qty,0), sum=lines.reduce((s,l)=>s+lineUnit(l)*l.qty,0);
    const rate=(VOLUME[c].find(([n])=>units>=n)||[0,0])[1];
    gross+=sum; disc+=sum*rate;
  });
  const total=gross-disc;
  return {gross,disc,total,net:total/(1+VAT),vat:total-total/(1+VAT)};
}
function updateCount(){ $("#cartCount").textContent=cart.reduce((s,l)=>s+l.qty,0); }
let coState={business:mode==="b2b",sent:false};
function renderCart(){
  const body=$("#cartBody");
  if(!cart.length){ body.innerHTML=`<div class="empty"><h2 style="font-size:1.5rem">${t("cart_empty")}</h2><p>${t("cart_empty_d")}</p><a class="btn btn-blue" href="#shop">${t("nav_shop")}</a></div>`; return; }
  const tt=totals();
  const lines=cart.map((l,i)=>{const p=byId(l.id);return `<div class="line">
    <div class="thumb">${prodPic(p)}</div>
    <div class="meta"><h3 style="font-size:1.05rem">${p.n[lang]}</h3>${l.extras.length?`<p>+ ${l.extras.map(e=>EXTRAS[e].n[lang]).join(", ")}</p>`:""}
     <div class="qty" style="margin-top:10px"><button data-q="${i}|-1" aria-label="−">−</button><span>${l.qty}</span><button data-q="${i}|1" aria-label="+">+</button></div></div>
    <div class="right"><span class="note">${t("on_request")}</span><button class="linkbtn" data-rm="${i}">${t("remove")}</button></div>
   </div>`}).join("");
  const rows = `<p style="font-weight:600">${t("quote_note")}</p>`;
  const v=id=>($("#"+id)||{}).value||"";
  const keep={name:v("coName"),email:v("coEmail"),phone:v("coPhone"),addr:v("coAddr"),zip:v("coZip"),city:v("coCity"),company:v("coCompany"),cif:v("coCif"),terms:($("#coTerms")||{}).checked};
  body.innerHTML=`<div class="cartlay">
   <div>${lines}<p class="note" style="margin-top:16px">${t("pd_delivery")}</p></div>
   <div class="sum">${rows}
    <h3 style="margin:26px 0 14px">${t("co_title")}</h3>
    <div class="field"><label for="coName">${t("co_name")}</label><input type="text" id="coName" autocomplete="name"></div>
    <div class="row2"><div class="field"><label for="coEmail">${t("co_email")}</label><input type="email" id="coEmail" autocomplete="email"></div><div class="field"><label for="coPhone">${t("co_phone")}</label><input type="tel" id="coPhone" autocomplete="tel"></div></div>
    <div class="field"><label for="coAddr">${t("co_address")}</label><input type="text" id="coAddr" autocomplete="street-address"></div>
    <div class="row2"><div class="field"><label for="coZip">${t("co_zip")}</label><input type="text" id="coZip" autocomplete="postal-code" inputmode="numeric"></div><div class="field"><label for="coCity">${t("co_city")}</label><input type="text" id="coCity" autocomplete="address-level2"></div></div>
    <label class="check"><input type="checkbox" id="coBiz" ${coState.business?"checked":""}><span>${t("co_business")}</span></label>
    <div class="row2" id="bizFields" ${coState.business?"":"hidden"}><div class="field"><label for="coCompany">${t("co_company")}</label><input type="text" id="coCompany" autocomplete="organization"></div><div class="field"><label for="coCif">${t("co_cif")}</label><input type="text" id="coCif"></div></div>
    <label class="check"><input type="checkbox" id="coTerms"><span>${t("co_terms")} <a href="#terms">${t("foot_privacy")}</a></span></label>
    <button class="btn btn-amber" id="coSend" style="width:100%;margin-top:8px">${t("co_send")}</button>
    <p class="note" style="margin-top:10px">${t("co_note")}</p>
    <div id="coMsg"></div>
   </div></div>`;
  Object.entries({coName:keep.name,coEmail:keep.email,coPhone:keep.phone,coAddr:keep.addr,coZip:keep.zip,coCity:keep.city,coCompany:keep.company,coCif:keep.cif}).forEach(([k,val])=>{const el=$("#"+k); if(el) el.value=val;});
  if(keep.terms) $("#coTerms").checked=true;
}
function orderText(f){
  const ls=cart.map(l=>`- ${l.qty} × ${byId(l.id).n[lang]}${l.extras.length?" (+ "+l.extras.map(e=>EXTRAS[e].n[lang]).join(", ")+")":""}`).join("\n");
  return `${t("order")} – Bruna Logistics\n\n${ls}\n\n${f.name}\n${f.email} / ${f.phone}\n${f.addr}, ${f.zip} ${f.city}${f.biz?`\n${f.company} – ${f.cif}`:""}`;
}
function sendOrder(){
  const g=id=>$("#"+id).value.trim();
  const f={name:g("coName"),email:g("coEmail"),phone:g("coPhone"),addr:g("coAddr"),zip:g("coZip"),city:g("coCity"),company:g("coCompany"),cif:g("coCif"),biz:$("#coBiz").checked};
  const ok=f.name&&/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email)&&f.phone&&f.addr&&f.zip&&$("#coTerms").checked;
  const m=$("#coMsg");
  if(!ok){ m.innerHTML=`<p class="msg err">${t("co_err")}</p>`; return; }
  const txt=orderText(f);
  m.innerHTML=`<p class="msg ok">${t("co_ok")}</p><div class="btns" style="margin-top:10px"><a class="btn btn-blue btn-sm" href="mailto:${CONTACT.email}?subject=${encodeURIComponent(t("order")+" – "+f.name)}&body=${encodeURIComponent(txt)}">${t("co_mail")}</a><a class="btn btn-line btn-sm" target="_blank" rel="noopener" href="https://wa.me/${CONTACT.whatsapp}?text=${encodeURIComponent(txt)}">${t("co_wa")}</a></div>`;
}

/* ===== Contact ===== */
function renderChannels(){
  const ic={
    wa:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20l1.3-4A8 8 0 1 1 8 19Z"/><path d="M9 9c0 3 3 6 6 6"/></svg>`,
    mail:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>`,
    cal:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>`,
    wc:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4C5 4 2 6.5 2 9.7c0 1.8 1 3.4 2.6 4.4L4 17l3-1.6"/><path d="M15 9c4 0 7 2.4 7 5.4 0 1.6-.9 3-2.3 4l.5 2.6-2.7-1.4c-.8.2-1.6.3-2.5.3-4 0-7-2.4-7-5.5S11 9 15 9Z"/></svg>`,
    pin:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-7 7-12a7 7 0 1 0-14 0c0 5 7 12 7 12Z"/><circle cx="12" cy="10" r="2.5"/></svg>`};
  const ch=[{h:`https://wa.me/${CONTACT.whatsapp}`,i:ic.wa,t:"WhatsApp",d:t("cc_wa_d"),v:CONTACT.whatsappLabel,ext:1},{h:`mailto:${CONTACT.email}`,i:ic.mail,t:t("ch_email"),d:t("cc_email_d"),v:CONTACT.email},{h:CONTACT.booking,i:ic.cal,t:t("ch_book"),d:t("cc_book_d"),v:"Cal.com / Google Calendar"},{h:null,i:ic.wc,t:t("cc_wechat"),d:t("cc_wechat_d"),v:"ID: "+CONTACT.wechat},{h:null,i:ic.pin,t:t("cc_office"),d:t("cc_office_d"),v:CONTACT.office}];
  $("#channels").innerHTML=ch.map(c=>{const inner=`${c.i}<h3>${c.t}</h3><p>${c.d}</p><span class="val">${c.v}</span>`;return c.h?`<a class="channel" href="${c.h}"${c.ext?' target="_blank" rel="noopener"':""}>${inner}</a>`:`<div class="channel">${inner}</div>`}).join("");
  $("#ctaWa").href=`https://wa.me/${CONTACT.whatsapp}`; $("#ctaMail").href=`mailto:${CONTACT.email}`; $("#ctaBook").href=CONTACT.booking;
}

/* ===== Toast ===== */
let toastT;
function showToast(){ const el=$("#toast"); el.innerHTML=`<span>${t("added")}</span><a href="#cart">${t("go_cart")}</a>`; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,3200); }

/* ===== Router ===== */
const VIEWS=["home","shop","cart","how","business","contact","terms"];
const EVIEWS=["energy","energy-homes","energy-sourcing","energy-partners","energy-contact"];
function route(){
  const h=location.hash.slice(1);
  let v = (VIEWS.includes(h)||EVIEWS.includes(h))?h:"home";
  if(h.startsWith("p-") && byId(h.slice(2))){ v="product"; if(currentProduct!==h.slice(2)){currentProduct=h.slice(2); pdState={extras:[],qty:1};} renderProduct(currentProduct); }
  else currentProduct=null;
  $$("[data-view]").forEach(el=>el.hidden=el.dataset.view!==v);
  $$("[data-route]").forEach(a=>{ const on=a.dataset.route===v||(v==="product"&&a.dataset.route==="shop"); if(on) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  const en=EVIEWS.includes(v);
  document.documentElement.dataset.brand = en?"energy":"logistics";
  $$("[data-sub]").forEach(a=>{ if(a.dataset.sub===v) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  $("#ctaBand").hidden = en || ["contact","cart"].includes(v);
  $("#eCtaBand").hidden = !en || v==="energy-contact";
  setBrandUI();
  $("#mainNav").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded","false");
  if(v==="cart") renderCart();
  window.scrollTo(0,0);
}

/* ===== Events ===== */
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-add]"); if(a){ addToCart(a.dataset.add); return; }
  const f=e.target.closest("[data-filter]"); if(f){ filter=f.dataset.filter; renderGrid(); return; }
  const fl=e.target.closest("[data-filter-link]"); if(fl){ filter=fl.dataset.filterLink; renderGrid(); }
  const q=e.target.closest("[data-q]"); if(q){ const [i,d]=q.dataset.q.split("|").map(Number); cart[i].qty=Math.max(1,cart[i].qty+d); store.set("bl-cart",cart); renderCart(); updateCount(); return; }
  const rm=e.target.closest("[data-rm]"); if(rm){ cart.splice(+rm.dataset.rm,1); store.set("bl-cart",cart); renderCart(); updateCount(); return; }
  const pq=e.target.closest("[data-pdq]"); if(pq){ pdState.qty=Math.max(1,pdState.qty+ +pq.dataset.pdq); renderProduct(currentProduct); return; }
  if(e.target.closest("#pdAdd")){ addToCart(currentProduct,pdState.extras,pdState.qty); return; }
  if(e.target.closest("#coSend")){ sendOrder(); return; }
  const lb=e.target.closest("[data-lang]"); if(lb){ lang=lb.dataset.lang; store.set("bl-lang",lang); applyLang(); return; }
  const mb=e.target.closest("[data-mode]"); if(mb){ mode=mb.dataset.mode; store.set("bl-mode",mode); coState.business=mode==="b2b"; $$("[data-mode]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.mode===mode))); renderAll(); return; }
});
document.addEventListener("change",e=>{
  if(e.target.matches("[data-extra]")){ const x=e.target.dataset.extra; pdState.extras = e.target.checked ? [...pdState.extras,x] : pdState.extras.filter(y=>y!==x); renderProduct(currentProduct); }
  if(e.target.id==="coBiz"){ coState.business=e.target.checked; $("#bizFields").hidden=!e.target.checked; }
});
$("#menuBtn").addEventListener("click",()=>{ const o=$("#mainNav").classList.toggle("open"); $("#menuBtn").setAttribute("aria-expanded",String(o)); });
window.addEventListener("hashchange",route);
document.documentElement.dataset.brand="logistics";
applyLang(); route();
</script>
